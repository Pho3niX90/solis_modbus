name: Run tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Job-level permissions cannot use expressions; split by event instead.
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run linter
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Run all tests
        run: uv run pytest

  test-and-format:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run linter
        run: uv run ruff check

      - name: Format
        run: uv run ruff format

      - name: Commit formatting fixes
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "style: apply ruff format"
          file_pattern: "*.py"

      - name: Run all tests
        run: uv run pytest
