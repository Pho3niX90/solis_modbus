name: Release on Merge

# Merging a `release/X.Y.Z` branch into master releases it:
#
# 1. release.yaml releases vX.Y.Z from the branch as it was merged, merges the
#    version bump into master, and closes milestone X.Y.Z. A version already
#    released by running Release on the branch is left as it is.
# 2. `release/X.(Y+1).0` is opened from master, so the next version has a branch
#    (and, through release_branch.yaml, a milestone) to collect PRs and issues.
#    Hotfix branches (`release/X.Y.Z`, Z > 0) don't advance it: merging 4.3.1
#    finds release/4.4.0 already open. Other open release branches get master
#    through release_sync.yaml; ones older than the merged release can no longer
#    be released, and the merged PR gets a comment naming them.
#
# If the release fails, the next branch isn't opened; re-running the failed jobs
# resumes both.

on:
  pull_request:
    types: [closed]
    branches: [master]

# The jobs act only through the PAT; GITHUB_TOKEN needs no access.
permissions: {}

jobs:
  release:
    name: Release
    if: >-
      github.event.pull_request.merged
      && startsWith(github.event.pull_request.head.ref, 'release/')
      && github.event.pull_request.head.repo.full_name == github.repository
    # What release.yaml's job asks for: a called workflow gets no more than this.
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yaml
    with:
      branch: ${{ github.event.pull_request.head.ref }}
      sha: ${{ github.event.pull_request.head.sha }}
      merge_sha: ${{ github.event.pull_request.merge_commit_sha }}
    secrets:
      PAT: ${{ secrets.PAT }}

  open-next:
    name: Open next release branch
    # After the release, so the new branch starts from the released version.
    needs: release
    runs-on: ubuntu-latest
    env:
      # A PAT, so creating the branch triggers release_branch.yaml (events from
      # GITHUB_TOKEN trigger no workflows).
      GH_TOKEN: ${{ secrets.PAT }}
      GH_REPO: ${{ github.repository }}
      MERGED_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Work out the next version
        run: |
          version="${MERGED_BRANCH#release/}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::warning::$MERGED_BRANCH is not named release/X.Y.Z; not opening a next release branch"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          next="${BASH_REMATCH[1]}.$(( BASH_REMATCH[2] + 1 )).0"
          echo "NEXT=$next" >> "$GITHUB_ENV"

      - name: Create release branch
        if: env.SKIP != 'true'
        run: |
          branch="release/$NEXT"
          if gh api "repos/$GH_REPO/git/ref/heads/$branch" > /dev/null 2>&1; then
            echo "$branch already exists"
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v$NEXT" > /dev/null 2>&1; then
            echo "::warning::v$NEXT is already released; not opening $branch"
            exit 0
          fi

          # master as it is now, holding the release's version bump: the branch
          # starts level with the release, so its first candidate waits until
          # something new reaches it.
          sha=$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq .object.sha)
          gh api -X POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/heads/$branch" \
            -f sha="$sha" > /dev/null
          echo "Opened $branch at $sha" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Flag release branches older than this release
        if: env.SKIP != 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          merged="${MERGED_BRANCH#release/}"
          stale=()
          for branch in $(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name | select(startswith("release/"))'); do
            version="${branch#release/}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            [ "$version" = "$merged" ] && continue
            # Released already: a leftover branch, not unshipped work.
            gh api "repos/$GH_REPO/git/ref/tags/v$version" > /dev/null 2>&1 && continue
            if [ "$(printf '%s\n%s\n' "$version" "$merged" | sort -V | tail -1)" = "$merged" ]; then
              stale+=("$branch")
            fi
          done

          if [ ${#stale[@]} -gt 0 ]; then
            {
              echo "These release branches are older than v$merged and can no longer be released (a release must be newer than the latest):"
              echo
              for branch in "${stale[@]}"; do
                echo "- \`$branch\`"
              done
              echo
              echo "Move any changes they still need into master, then delete them."
            } > stale.md
            gh pr comment "$PR_NUMBER" --body-file stale.md
            cat stale.md >> "$GITHUB_STEP_SUMMARY"
          fi
