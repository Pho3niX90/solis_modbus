name: Release

# Cuts a stable release, marked latest.
#
# - Merging a `release/X.Y.Z` branch into master (the normal way):
#   release_next.yaml calls this workflow, which releases vX.Y.Z from the branch
#   as it was merged, merges the version bump into master, and closes milestone
#   X.Y.Z. Release candidates are published by release_branch.yaml on every push
#   to the branch.
# - Run on a `release/X.Y.Z` branch: releases vX.Y.Z before the branch is
#   merged, opens a PR merging it back into master, and closes the milestone.
#   Merging that PR then finds the release done.
# - Run on master: bumps the patch version past the latest release (the old
#   flow). Refused while a release branch is unreleased: master holds that
#   branch's work, which would ship as a patch. Hotfixes belong on a
#   release/X.Y.Z branch cut from the last tag.
#
# Re-running resumes after a partial failure: once the version is tagged,
# nothing is re-tagged; the GitHub release is created if it is missing, and the
# remaining steps run.
#
# Pre-releases come only from release_branch.yaml (vX.Y.Z-rc.N). A plain vX.Y.Z
# tag always means a stable release, which the version checks rely on.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      branch:
        description: The release/X.Y.Z branch that was merged into master
        type: string
        required: true
      sha:
        description: The branch's head when it was merged, which is released
        type: string
        required: true
      merge_sha:
        description: The commit that merged it into master
        type: string
        required: true
    secrets:
      PAT:
        required: true

env:
  COMPONENT_NAME: solis_modbus
  MANIFEST: custom_components/solis_modbus/manifest.json

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    # One at a time: running Release on a branch while its merge is releasing it
    # waits, then finds the version tagged and resumes.
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.PAT }}
      GH_REPO: ${{ github.repository }}
      # Called for a merged release branch, or else the branch Release is run on.
      BRANCH: ${{ inputs.branch || github.ref_name }}
      MERGED_HEAD: ${{ inputs.sha }}
      MERGE_SHA: ${{ inputs.merge_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Empty, so the branch Release is run on, unless called for a merge.
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          # master requires PR reviews, so the default GITHUB_TOKEN cannot push
          # the version bump. The PAT (repo admin) bypasses that rule.
          token: ${{ secrets.PAT }}

      - name: Install Python semver
        run: pip install semver

      - name: Work out the version
        run: |
          stable_tags() {
            git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V
          }
          newer() {
            python -c "import semver, sys; sys.exit(0 if semver.compare('$1', '$2') > 0 else 1)"
          }
          # Whether two commits ship the same integration. The manifest version
          # doesn't count: every candidate and release stamps its own.
          same_code() {
            git diff --quiet "$1" "$2" -- custom_components hacs.json ":(exclude)$MANIFEST" \
              && [ "$(git show "$1:$MANIFEST" | jq -S 'del(.version)')" = "$(git show "$2:$MANIFEST" | jq -S 'del(.version)')" ]
          }
          latest=$(stable_tags | tail -1)

          case "$BRANCH" in
            release/*)
              version="${BRANCH#release/}"
              if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                if [ -n "$MERGED_HEAD" ]; then
                  echo "::warning::$BRANCH is not named release/X.Y.Z; not releasing it"
                  echo "DONE=true" >> "$GITHUB_ENV"
                  exit 0
                fi
                echo "::error::Branch $BRANCH is not named release/X.Y.Z"
                exit 1
              fi
              if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
                # Only the newest release can be resumed; an older one is done.
                if [ "$version" != "$latest" ]; then
                  if [ -n "$MERGED_HEAD" ]; then
                    # A release cut by running Release on its branch, merged back
                    # after a newer one.
                    echo "::notice::v$version was released before v$latest; nothing to do"
                    echo "DONE=true" >> "$GITHUB_ENV"
                    exit 0
                  fi
                  echo "::error::v$version was released before v$latest; nothing to do"
                  exit 1
                fi
                # Cut from this branch: the tag is on it, or (cut when the branch
                # was merged) the tag is the version bump on top of it.
                if ! git merge-base --is-ancestor "v$version" HEAD \
                  && ! { [ -n "$MERGED_HEAD" ] && git merge-base --is-ancestor HEAD "v$version"; }; then
                  echo "::error::v$version exists but is not on $BRANCH"
                  exit 1
                fi
                echo "::notice::v$version is already tagged; resuming the remaining steps"
                echo "RESUME=true" >> "$GITHUB_ENV"
              else
                if [ -n "$latest" ] && ! newer "$version" "$latest"; then
                  echo "::error::$BRANCH is not newer than the latest release, v$latest"
                  exit 1
                fi
                # A hotfix branch (Z > 0) is cut from the latest release and doesn't
                # receive master. Merging master into it (say, to resolve conflicts
                # on its PR) brings in master's unreleased work, which must not ship
                # as a patch: whatever it shares with master must be released.
                if [ "${version##*.}" != 0 ] && [ -n "$latest" ]; then
                  master=origin/master
                  if [ -n "$MERGED_HEAD" ]; then
                    master="$MERGE_SHA^1"  # master before the merge
                  fi
                  if ! same_code "v$latest" "$(git merge-base HEAD "$master")"; then
                    echo "::error::$BRANCH holds work from master that isn't in v$latest, and a hotfix must not ship it. Cut the hotfix from the release tag and cherry-pick the fixes onto it (see CONTRIBUTING.md)."
                    exit 1
                  fi
                fi
              fi
              if [ -n "$MERGED_HEAD" ]; then
                echo "MERGE_INTO_MASTER=true" >> "$GITHUB_ENV"
              else
                echo "BACK_MERGE=true" >> "$GITHUB_ENV"
              fi
              ;;
            master)
              # Master holds the work of every unreleased release branch; releasing
              # it would ship that as a patch (or take a hotfix branch's version).
              pending=()
              for branch in $(git branch -r --list 'origin/release/*' | sed 's|^ *origin/||'); do
                v="${branch#release/}"
                [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
                # Released, or older than the latest release: nothing left to ship.
                git rev-parse -q --verify "refs/tags/v$v" > /dev/null && continue
                [ -n "$latest" ] && ! newer "$v" "$latest" && continue
                pending+=("$branch")
              done
              if [ ${#pending[@]} -gt 0 ]; then
                echo "::error::Not releasing master while ${pending[*]} is unreleased: release through the branch, by merging it into master. For a hotfix, cut release/X.Y.Z from the latest release tag (see CONTRIBUTING.md)."
                exit 1
              fi
              current=$(jq -r '.version' "$MANIFEST")
              if [ -z "$latest" ] || { python -c "import semver; semver.Version.parse('$current')" 2> /dev/null && newer "$current" "$latest"; }; then
                version="$current"
              else
                version=$(python -c "import semver; print(semver.bump_patch('$latest'))")
              fi
              ;;
            *)
              echo "::error::Run Release on master or on a release/X.Y.Z branch"
              exit 1
              ;;
          esac

          # Notes run from the stable release just before this one.
          previous=$({ stable_tags; echo "$version"; } | sort -V | uniq | grep -B1 -x -F "$version" | grep -v -x -F "$version" || true)

          echo "Releasing v$version (previous: ${previous:-none})"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PREVIOUS=$previous" >> "$GITHUB_ENV"

      - name: Commit the version bump
        if: env.RESUME != 'true' && env.DONE != 'true'
        run: |
          jq --arg v "$VERSION" '.version = $v' "$MANIFEST" > manifest.tmp.json && mv manifest.tmp.json "$MANIFEST"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          # Compare the index, not the working tree: after `git add` a plain
          # `git diff` is always empty, which silently skipped the bump.
          if ! git diff --cached --quiet; then
            # release_branch.yaml skips pushes with this message, so no release
            # candidate is published after the release.
            git commit -m "chore: bump version to v$VERSION"
            if [ -z "$MERGED_HEAD" ]; then
              git push origin "HEAD:$BRANCH"
            fi
          fi
          if [ -n "$MERGED_HEAD" ]; then
            # The merged branch is finished, so the bump commit goes on no branch
            # yet: push it as the tag, so GitHub can release it. Tagged before
            # master gets the bump, so the workflows that push starts see vX.Y.Z
            # released.
            git tag "v$VERSION"
            git push origin "refs/tags/v$VERSION"
          fi

      - name: Find the release commit
        if: env.DONE != 'true'
        run: |
          # The tag once there is one (resuming, or a merged branch just tagged),
          # or else the bump just pushed.
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            sha=$(git rev-list -n 1 "v$VERSION")
          else
            sha=$(git rev-parse HEAD)
          fi
          git checkout -q "$sha"

          actual=$(jq -r '.version' "$MANIFEST")
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::manifest.json at $sha is $actual, expected $VERSION"
            exit 1
          fi

          echo "SHA=$sha" >> "$GITHUB_ENV"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "RELEASE_EXISTS=true" >> "$GITHUB_ENV"
          fi

      - name: Zip ${{ env.COMPONENT_NAME }} dir
        if: env.DONE != 'true' && env.RELEASE_EXISTS != 'true'
        run: |
          cd "custom_components/${COMPONENT_NAME}"
          zip -r -y "${GITHUB_WORKSPACE}/${COMPONENT_NAME}.zip" ./ -x '__pycache__/*' '*/__pycache__/*'

      - name: Generate release notes
        if: env.DONE != 'true' && env.RELEASE_EXISTS != 'true'
        run: |
          # Name the previous stable tag explicitly: left to GitHub, a release
          # candidate could be picked and the notes would only cover its tail.
          previous=()
          if [ -n "$PREVIOUS" ]; then
            previous=(-f previous_tag_name="v$PREVIOUS")
          fi
          gh api -X POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="v$VERSION" \
            -f target_commitish="$SHA" \
            "${previous[@]}" \
            --jq .body > release_notes.md

      - name: Publish release
        if: env.DONE != 'true' && env.RELEASE_EXISTS != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.COMPONENT_NAME }}.zip
          tag_name: v${{ env.VERSION }}
          # Tag the bump commit so the release source has the right manifest version.
          target_commitish: ${{ env.SHA }}
          name: v${{ env.VERSION }}
          token: ${{ secrets.PAT }}
          body_path: release_notes.md
          prerelease: false
          make_latest: true

      - name: Move the latest tag
        if: env.DONE != 'true'
        run: |
          git tag -f latest "$SHA"
          git push -f origin refs/tags/latest

      - name: Open PR merging the release branch into master
        if: env.BACK_MERGE == 'true'
        run: |
          if [ -n "$(gh pr list --base master --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A PR from $BRANCH into master is already open"
            exit 0
          fi

          # Issues fixed on the release branch are not closed by its PRs, whose
          # base is not the default branch. List the milestone's open issues so
          # merging this PR closes them.
          issues=$(gh issue list --milestone "$VERSION" --state open --limit 200 --json number --jq '.[].number')
          {
            echo "Merges the changes made on \`$BRANCH\` for v$VERSION back into master."
            if [ -n "$issues" ]; then
              echo
              echo "Open issues in milestone $VERSION. **Remove the line for any issue this release does not fix before merging:**"
              echo
              for issue in $issues; do
                echo "Closes #$issue"
              done
            fi
          } > backmerge.md

          # A PAT (GH_TOKEN), so the PR's checks run: events from GITHUB_TOKEN
          # trigger no workflows.
          gh pr create --base master --head "$BRANCH" \
            --title "Merge $BRANCH into master" \
            --body-file backmerge.md

      - name: Merge the version bump into master
        if: env.MERGE_INTO_MASTER == 'true'
        run: |
          # The release commit is the merged branch plus its version bump, so
          # merging it brings master the bump, and puts vX.Y.Z on master's
          # history as a back-merge would.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3; do
            git fetch -q origin master
            if git merge-base --is-ancestor "$SHA" origin/master; then
              echo "master already has v$VERSION"
              exit 0
            fi
            git checkout -q --detach origin/master
            if ! git merge -q --no-ff -m "Merge v$VERSION into master" "$SHA"; then
              echo "::error::v$VERSION is released, but its version bump conflicts with master. Set the version in $MANIFEST to $VERSION on master by hand."
              exit 1
            fi
            # Rejected if master moved since the fetch; then merge onto the new tip.
            if git push -q origin HEAD:master; then
              echo "Merged v$VERSION into master" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::v$VERSION is released, but master kept moving, so its version bump wasn't merged. Set the version in $MANIFEST to $VERSION on master by hand."
          exit 1

      - name: Close milestone
        if: env.DONE != 'true'
        run: |
          milestone=$(gh api --paginate "repos/$GH_REPO/milestones?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$VERSION\") | \"\(.number) \(.open_issues)\"" | head -1)
          if [ -z "$milestone" ]; then
            echo "No open milestone $VERSION"
            exit 0
          fi
          number="${milestone%% *}"
          open="${milestone##* }"
          # A back-merge PR lists the open issues to close; a merged branch has
          # had no such PR, so point them out.
          if [ -n "$MERGED_HEAD" ] && [ "$open" != 0 ]; then
            echo "::warning::Milestone $VERSION still has $open open issue(s) or PR(s). Close the ones this release fixed, and move the rest to the next milestone."
          fi
          gh api -X PATCH "repos/$GH_REPO/milestones/$number" -f state=closed > /dev/null
          echo "Closed milestone $VERSION (#$number)"
