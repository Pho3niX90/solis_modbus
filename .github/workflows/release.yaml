name: Release

# Cuts a stable release, marked latest.
#
# - On a `release/X.Y.Z` branch (the normal way): releases vX.Y.Z, opens a PR
#   merging the branch back into master, and closes milestone X.Y.Z. Release
#   candidates are published by release_branch.yaml on every push.
# - On master: bumps the patch version past the latest release (the old flow).
#   Master may hold unreleased features, so it warns while release branches are
#   open; hotfixes belong on a release/X.Y.Z branch cut from the last tag.
#
# Re-running resumes after a partial failure: on a release branch whose version
# is already tagged, nothing is re-tagged; the GitHub release is created if it
# is missing, and the remaining steps run.
#
# Pre-releases come only from release_branch.yaml (vX.Y.Z-rc.N). A plain vX.Y.Z
# tag always means a stable release, which the version checks rely on.

on:
  workflow_dispatch:

env:
  COMPONENT_NAME: solis_modbus
  MANIFEST: custom_components/solis_modbus/manifest.json

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.PAT }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # master requires PR reviews, so the default GITHUB_TOKEN cannot push
          # the version bump. The PAT (repo admin) bypasses that rule.
          token: ${{ secrets.PAT }}

      - name: Install Python semver
        run: pip install semver

      - name: Work out the version
        run: |
          stable_tags() {
            git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V
          }
          newer() {
            python -c "import semver, sys; sys.exit(0 if semver.compare('$1', '$2') > 0 else 1)"
          }
          latest=$(stable_tags | tail -1)

          case "$GITHUB_REF_NAME" in
            release/*)
              version="${GITHUB_REF_NAME#release/}"
              if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::Branch $GITHUB_REF_NAME is not named release/X.Y.Z"
                exit 1
              fi
              if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
                # Only the newest release can be resumed; an older one is done.
                if [ "$version" != "$latest" ]; then
                  echo "::error::v$version was released before v$latest; nothing to do"
                  exit 1
                fi
                if ! git merge-base --is-ancestor "v$version" HEAD; then
                  echo "::error::v$version exists but is not on $GITHUB_REF_NAME"
                  exit 1
                fi
                echo "::notice::v$version is already tagged; resuming the remaining steps"
                echo "RESUME=true" >> "$GITHUB_ENV"
              elif [ -n "$latest" ] && ! newer "$version" "$latest"; then
                echo "::error::$GITHUB_REF_NAME is not newer than the latest release, v$latest"
                exit 1
              fi
              echo "BACK_MERGE=true" >> "$GITHUB_ENV"
              ;;
            master)
              open=$(git branch -r --list 'origin/release/*' | sed 's|^ *origin/||' | paste -sd ' ' -)
              if [ -n "$open" ]; then
                echo "::warning::Releasing from master while release branches are open ($open). Master may contain unreleased features; prefer a release/X.Y.Z hotfix branch cut from the last release tag."
              fi
              current=$(jq -r '.version' "$MANIFEST")
              if [ -z "$latest" ] || { python -c "import semver; semver.Version.parse('$current')" 2> /dev/null && newer "$current" "$latest"; }; then
                version="$current"
              else
                version=$(python -c "import semver; print(semver.bump_patch('$latest'))")
              fi
              ;;
            *)
              echo "::error::Run Release on master or on a release/X.Y.Z branch"
              exit 1
              ;;
          esac

          # Notes run from the stable release just before this one.
          previous=$({ stable_tags; echo "$version"; } | sort -V | uniq | grep -B1 -x -F "$version" | grep -v -x -F "$version" || true)

          echo "Releasing v$version (previous: ${previous:-none})"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PREVIOUS=$previous" >> "$GITHUB_ENV"

      - name: Commit and push version bump
        if: env.RESUME != 'true'
        run: |
          jq --arg v "$VERSION" '.version = $v' "$MANIFEST" > manifest.tmp.json && mv manifest.tmp.json "$MANIFEST"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          # Compare the index, not the working tree: after `git add` a plain
          # `git diff` is always empty, which silently skipped the bump.
          if ! git diff --cached --quiet; then
            # release_branch.yaml skips pushes with this message, so no release
            # candidate is published after the release.
            git commit -m "chore: bump version to v$VERSION"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Find the release commit
        run: |
          if [ "$RESUME" = "true" ]; then
            sha=$(git rev-list -n 1 "v$VERSION")
          else
            sha=$(git rev-parse HEAD)
          fi
          git checkout -q "$sha"

          actual=$(jq -r '.version' "$MANIFEST")
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::manifest.json at $sha is $actual, expected $VERSION"
            exit 1
          fi

          echo "SHA=$sha" >> "$GITHUB_ENV"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "RELEASE_EXISTS=true" >> "$GITHUB_ENV"
          fi

      - name: Zip ${{ env.COMPONENT_NAME }} dir
        if: env.RELEASE_EXISTS != 'true'
        run: |
          cd "custom_components/${COMPONENT_NAME}"
          zip -r -y "${GITHUB_WORKSPACE}/${COMPONENT_NAME}.zip" ./ -x '__pycache__/*' '*/__pycache__/*'

      - name: Generate release notes
        if: env.RELEASE_EXISTS != 'true'
        run: |
          # Name the previous stable tag explicitly: left to GitHub, a release
          # candidate could be picked and the notes would only cover its tail.
          previous=()
          if [ -n "$PREVIOUS" ]; then
            previous=(-f previous_tag_name="v$PREVIOUS")
          fi
          gh api -X POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="v$VERSION" \
            -f target_commitish="$SHA" \
            "${previous[@]}" \
            --jq .body > release_notes.md

      - name: Publish release
        if: env.RELEASE_EXISTS != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.COMPONENT_NAME }}.zip
          tag_name: v${{ env.VERSION }}
          # Tag the bump commit so the release source has the right manifest version.
          target_commitish: ${{ env.SHA }}
          name: v${{ env.VERSION }}
          token: ${{ secrets.PAT }}
          body_path: release_notes.md
          prerelease: false
          make_latest: true

      - name: Move the latest tag
        run: |
          git tag -f latest "$SHA"
          git push -f origin refs/tags/latest

      - name: Open PR merging the release branch into master
        if: env.BACK_MERGE == 'true'
        run: |
          if [ -n "$(gh pr list --base master --head "$GITHUB_REF_NAME" --state open --json number --jq '.[].number')" ]; then
            echo "A PR from $GITHUB_REF_NAME into master is already open"
            exit 0
          fi

          # Issues fixed on the release branch are not closed by its PRs, whose
          # base is not the default branch. List the milestone's open issues so
          # merging this PR closes them.
          issues=$(gh issue list --milestone "$VERSION" --state open --limit 200 --json number --jq '.[].number')
          {
            echo "Merges the changes made on \`$GITHUB_REF_NAME\` for v$VERSION back into master."
            if [ -n "$issues" ]; then
              echo
              echo "Open issues in milestone $VERSION. **Remove the line for any issue this release does not fix before merging:**"
              echo
              for issue in $issues; do
                echo "Closes #$issue"
              done
            fi
          } > backmerge.md

          # A PAT (GH_TOKEN), so the PR's checks run: events from GITHUB_TOKEN
          # trigger no workflows.
          gh pr create --base master --head "$GITHUB_REF_NAME" \
            --title "Merge $GITHUB_REF_NAME into master" \
            --body-file backmerge.md

      - name: Close milestone
        run: |
          number=$(gh api --paginate "repos/$GH_REPO/milestones?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$VERSION\") | .number" | head -1)
          if [ -z "$number" ]; then
            echo "No open milestone $VERSION"
            exit 0
          fi
          gh api -X PATCH "repos/$GH_REPO/milestones/$number" -f state=closed > /dev/null
          echo "Closed milestone $VERSION (#$number)"
