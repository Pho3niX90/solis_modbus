solis_write_holding_register:
  name: Write holding register
  description: Writes a value to a holding register
  fields:
    address:
      name: Address
      description: Register address to write to
      required: true
      example: 43142
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    value:
      name: Value
      description: Value to write
      required: true
      example: 500
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    host:
      name: Host
      description: IP of the inverter, only required when running multiple inverters
      example: 192.168.1.75
      selector:
        text:
    slave:
      name: Slave
      description: Modbus device/slave ID (defaults to 1)
      example: 1
      selector:
        number:
          min: 1
          max: 247
          mode: box
solis_write_time:
  name: Write time
  description: Writes a time string to a Solis time entity
  fields:
    entity_id:
      name: Entity
      description: The Solis time entity to write to
      required: true
      example: "time.solis_time_charging_charge_start_slot_1"
      selector:
        entity:
          filter:
            integration: solis_modbus
            domain: time
    time:
      name: Time
      description: "Time string in HH:MM or HH:MM:SS"
      required: true
      example: "14:50"
      selector:
        time:
solis_read_register:
  name: Read register
  description: Reads one or more registers and returns the raw values (register discovery / debugging)
  fields:
    address:
      name: Address
      description: First register address to read
      required: true
      example: 33049
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      name: Count
      description: Number of consecutive registers to read (1-50)
      default: 1
      selector:
        number:
          min: 1
          max: 50
          mode: box
    register_type:
      name: Register type
      description: Input (3xxxx read-only data) or holding (4xxxx settings)
      default: input
      selector:
        select:
          options:
            - input
            - holding
    host:
      name: Host
      description: IP of the inverter, only required when running multiple inverters
      example: 192.168.1.75
      selector:
        text:
    slave:
      name: Slave
      description: Modbus device/slave ID (defaults to 1)
      example: 1
      selector:
        number:
          min: 1
          max: 247
          mode: box
solis_force_battery_charge:
  name: Force battery charge
  description: Force the battery to charge (hybrid inverters). Writes the enable + power + timeout combo in the order Solis firmware requires. Reverts automatically after the timeout.
  fields:
    power_watts:
      name: Charge power
      description: Charge power in watts (omit to keep the current setpoint)
      example: 3000
      selector:
        number:
          min: 0
          max: 60000
          step: 100
          unit_of_measurement: W
          mode: box
    duration_minutes:
      name: Duration
      description: Minutes before the command self-reverts (1-30, omit to keep the current timeout)
      example: 30
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: min
          mode: box
    host:
      name: Host
      description: IP of the inverter, only required when running multiple inverters
      selector:
        text:
    slave:
      name: Slave
      description: Modbus device/slave ID (defaults to 1)
      selector:
        number:
          min: 1
          max: 247
          mode: box
solis_force_battery_discharge:
