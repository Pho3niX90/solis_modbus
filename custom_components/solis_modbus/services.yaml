      name: Discharge power
      description: Discharge power in watts (omit to keep the current setpoint)
      example: 3000
      selector:
        number:
          min: 0
          max: 60000
          step: 100
          unit_of_measurement: W
          mode: box
    duration_minutes:
      name: Duration
      description: Minutes before the command self-reverts (1-30, omit to keep the current timeout)
      example: 30
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: min
          mode: box
    host:
      name: Host
      description: IP of the inverter, only required when running multiple inverters
      selector:
        text:
    slave:
      name: Slave
      description: Modbus device/slave ID (defaults to 1)
      selector:
        number:
          min: 1
          max: 247
          mode: box
solis_stop_force_charge_discharge:
  name: Stop force charge/discharge
  description: Cancel an active force charge or discharge (writes RC mode = none)
  fields:
    host:
      name: Host
      description: IP of the inverter, only required when running multiple inverters
      selector:
        text:
    slave:
      name: Slave
      description: Modbus device/slave ID (defaults to 1)
      selector:
        number:
          min: 1
          max: 247
          mode: box
